name: Build And Push Azure App Service Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: india-market-intel

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image name
        shell: bash
        run: |
          set -euo pipefail

          ACR_LOGIN_SERVER="$(az acr show --name "${{ secrets.AZURE_ACR_NAME }}" --query loginServer -o tsv)"
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$ACR_LOGIN_SERVER/${IMAGE_NAME}:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE_URI=$ACR_LOGIN_SERVER/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

          docker build \
            --build-arg APP_IMAGE_VERSION="$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            -t "$LATEST_IMAGE_URI" \
            .

          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

      - name: Deploy immutable image to App Service
        shell: bash
        run: |
          set -euo pipefail

          ACR_USER="$(az acr credential show --name "${{ secrets.AZURE_ACR_NAME }}" --query username -o tsv)"
          ACR_PASS="$(az acr credential show --name "${{ secrets.AZURE_ACR_NAME }}" --query 'passwords[0].value' -o tsv)"

          az webapp sitecontainers update \
            --name "${{ secrets.AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-name main \
            --image "$IMAGE_URI" \
            --target-port 8000 \
            --is-main true \
            --registry-username "$ACR_USER" \
            --registry-password "$ACR_PASS"

          az webapp config appsettings set \
            --name "${{ secrets.AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --settings \
              RESET_RUNTIME_WORKSPACE=false \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              ENABLE_SCRAPER_SCHEDULER=true \
              SOLAR_DAILY_UTC=02:30 \
              VAHAN_DAILY_UTC=03:30 \
              VAHAN_HEADFUL=true

          az webapp restart \
            --name "${{ secrets.AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: Verify deployment health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/api/health"
          for attempt in $(seq 1 30); do
            if curl -fSs --max-time 20 "$URL"; then
              exit 0
            fi
            echo "Waiting for App Service ($attempt/30)..."
            sleep 10
          done
          echo "App Service did not become healthy" >&2
          exit 1
