name: Build And Push Azure App Service Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: india-market-intel

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image name
        shell: bash
        run: |
          set -euo pipefail

          ACR_LOGIN_SERVER="$(az acr show --name "${{ secrets.AZURE_ACR_NAME }}" --query loginServer -o tsv)"
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$ACR_LOGIN_SERVER/${IMAGE_NAME}:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE_URI=$ACR_LOGIN_SERVER/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

          docker build \
            --build-arg APP_IMAGE_VERSION="$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            -t "$LATEST_IMAGE_URI" \
            .

          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

      - name: Show deployment info
        shell: bash
        run: |
          echo "Image pushed successfully:"
          echo "$LATEST_IMAGE_URI"
          echo "Restart the App Service from Azure Portal to pull this image."
