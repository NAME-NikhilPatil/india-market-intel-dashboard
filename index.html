<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Market Intelligence Dashboards</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1b18;
      --muted: #6d6860;
      --line: #d8d0c4;
      --panel: #fffaf2;
      --paper: #fff1e5;
      --accent: #b3312a;
      --accent-strong: #891f1a;
      --shadow: 0 10px 28px rgba(38, 31, 23, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 16px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 241, 229, 0.96);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 700;
    }

    .brand-kicker {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .switcher {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(128px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .tab {
      appearance: none;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tab:hover,
    .tab:focus-visible {
      color: var(--ink);
      outline: 2px solid rgba(179, 49, 42, 0.25);
      outline-offset: 1px;
    }

    .tab[aria-selected="true"] {
      background: var(--accent);
      color: #fffaf2;
      box-shadow: 0 1px 3px rgba(38, 31, 23, 0.18);
    }

    .open-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: var(--panel);
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-link:hover,
    .open-link:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(179, 49, 42, 0.22);
      outline-offset: 1px;
    }

    .ops-panel {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff8ef;
    }

    .ops-status {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .ops-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .ops-btn {
      appearance: none;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ops-btn:hover,
    .ops-btn:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(179, 49, 42, 0.2);
      outline-offset: 1px;
    }

    .ops-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .job-log {
      grid-column: 1 / -1;
      display: none;
      max-height: 180px;
      margin: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #1f1d1a;
      color: #f7efe4;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    .job-log.is-visible {
      display: block;
    }

    .frame-wrap {
      min-height: 0;
      padding: 12px;
    }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 145px);
      min-height: 640px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px;
      }

      .brand-title {
        font-size: 20px;
      }

      .switcher {
        width: 100%;
      }

      .open-link {
        width: 100%;
      }

      .ops-panel {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .ops-actions {
        justify-content: stretch;
      }

      .ops-btn {
        flex: 1 1 140px;
      }

      .frame-wrap {
        padding: 8px;
      }

      .dashboard-frame {
        height: calc(100vh - 292px);
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title">India Market Intelligence</h1>
        <div class="brand-kicker" id="dashboardDescription">VAHAN vehicle registration dashboard</div>
      </div>

      <div class="switcher" role="tablist" aria-label="Dashboard switcher">
        <button class="tab" id="tab-vahan" type="button" role="tab" aria-selected="true" aria-controls="dashboardFrame" data-dashboard="vahan">VAHAN Auto</button>
        <button class="tab" id="tab-solar" type="button" role="tab" aria-selected="false" aria-controls="dashboardFrame" data-dashboard="solar">Solar DCR</button>
      </div>

      <a class="open-link" id="openDirect" href="vahan_dashboard_project/vahan_dashboard_v19.html" target="_blank" rel="noopener">Open full page</a>
    </header>

    <section class="ops-panel" aria-label="Scraper operations">
      <div class="ops-status" id="opsStatus">Checking scraper API...</div>
      <div class="ops-actions">
        <button class="ops-btn" type="button" data-job="scrape-vahan">Refresh VAHAN</button>
        <button class="ops-btn" type="button" data-job="rebuild-vahan">Rebuild VAHAN</button>
        <button class="ops-btn" type="button" data-job="scrape-solar">Refresh Solar</button>
        <button class="ops-btn" type="button" data-job="rebuild-solar">Rebuild Solar</button>
      </div>
      <pre class="job-log" id="jobLog"></pre>
    </section>

    <section class="frame-wrap" aria-label="Selected dashboard">
      <iframe
        class="dashboard-frame"
        id="dashboardFrame"
        title="VAHAN vehicle registration dashboard"
        src="vahan_dashboard_project/vahan_dashboard_v19.html"
      ></iframe>
    </section>
  </main>

  <script>
    const dashboards = {
      vahan: {
        label: "VAHAN Auto",
        description: "VAHAN vehicle registration dashboard",
        title: "VAHAN vehicle registration dashboard",
        src: "vahan_dashboard_project/vahan_dashboard_v19.html"
      },
      solar: {
        label: "Solar DCR",
        description: "Solar DCR manufacturing intelligence dashboard",
        title: "Solar DCR manufacturing intelligence dashboard",
        src: "solar_dcr_scrape/solar_dcr_dashboard.html"
      }
    };

    const frame = document.getElementById("dashboardFrame");
    const openDirect = document.getElementById("openDirect");
    const description = document.getElementById("dashboardDescription");
    const tabs = Array.from(document.querySelectorAll("[data-dashboard]"));
    const opsStatus = document.getElementById("opsStatus");
    const jobLog = document.getElementById("jobLog");
    const jobButtons = Array.from(document.querySelectorAll("[data-job]"));
    let authEnabled = false;
    let activeJobId = null;
    let pollTimer = null;

    function normalizeDashboard(value) {
      return Object.prototype.hasOwnProperty.call(dashboards, value) ? value : "vahan";
    }

    function setDashboard(next, shouldPushHash = true) {
      const key = normalizeDashboard(next);
      const item = dashboards[key];

      frame.src = item.src;
      frame.title = item.title;
      openDirect.href = item.src;
      description.textContent = item.description;

      for (const tab of tabs) {
        const selected = tab.dataset.dashboard === key;
        tab.setAttribute("aria-selected", selected ? "true" : "false");
      }

      document.title = `${item.label} | India Market Intelligence`;

      if (shouldPushHash && window.location.hash !== `#${key}`) {
        window.history.replaceState(null, "", `#${key}`);
      }
    }

    for (const tab of tabs) {
      tab.addEventListener("click", () => setDashboard(tab.dataset.dashboard));
    }

    window.addEventListener("hashchange", () => {
      setDashboard(window.location.hash.slice(1), false);
    });

    setDashboard(window.location.hash.slice(1), false);

    function setOpsEnabled(enabled) {
      for (const button of jobButtons) {
        button.disabled = !enabled;
      }
    }

    function adminToken() {
      return window.localStorage.getItem("scraperAdminToken") || "";
    }

    function promptForToken() {
      const token = window.prompt("Enter SCRAPER_ADMIN_TOKEN");
      if (token) {
        window.localStorage.setItem("scraperAdminToken", token);
      }
      return token || "";
    }

    async function apiRequest(path, options = {}, retry = true) {
      const headers = new Headers(options.headers || {});
      headers.set("Accept", "application/json");
      if (options.body && !headers.has("Content-Type")) {
        headers.set("Content-Type", "application/json");
      }
      const token = adminToken();
      if (token) {
        headers.set("X-Admin-Token", token);
      }
      const response = await fetch(path, { ...options, headers });
      if ((response.status === 401 || response.status === 403) && retry) {
        promptForToken();
        return apiRequest(path, options, false);
      }
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      const type = response.headers.get("Content-Type") || "";
      return type.includes("application/json") ? response.json() : response.text();
    }

    async function checkHealth() {
      try {
        const health = await apiRequest("/api/health");
        authEnabled = Boolean(health.auth_enabled);
        const vahanTime = health.dashboards?.vahan?.updated_at || "unknown";
        const solarTime = health.dashboards?.solar?.updated_at || "unknown";
        if (authEnabled) {
          opsStatus.textContent = `Scraper API online. Auth enabled. VAHAN updated ${vahanTime}. Solar updated ${solarTime}.`;
          setOpsEnabled(true);
        } else {
          opsStatus.textContent = `Scraper API online, but SCRAPER_ADMIN_TOKEN is not configured. Add it in Azure App Settings to enable scraper controls. VAHAN updated ${vahanTime}. Solar updated ${solarTime}.`;
          setOpsEnabled(false);
        }
      } catch (error) {
        opsStatus.textContent = "Static viewer mode. Deploy with Azure App Service backend to enable scraper controls.";
        setOpsEnabled(false);
      }
    }

    async function refreshJobLog(jobId) {
      try {
        const text = await apiRequest(`/api/jobs/${jobId}/log`);
        jobLog.textContent = text || "Waiting for log output...";
        jobLog.classList.add("is-visible");
        jobLog.scrollTop = jobLog.scrollHeight;
      } catch (error) {
        jobLog.textContent = `Could not read job log: ${error.message}`;
        jobLog.classList.add("is-visible");
      }
    }

    async function pollJob(jobId) {
      activeJobId = jobId;
      window.clearTimeout(pollTimer);
      try {
        const job = await apiRequest(`/api/jobs/${jobId}`);
        const current = job.current_step ? ` · ${job.current_step}` : "";
        opsStatus.textContent = `Job ${job.kind} is ${job.status}${current}`;
        await refreshJobLog(jobId);
        if (job.status === "queued" || job.status === "running") {
          pollTimer = window.setTimeout(() => pollJob(jobId), 3000);
        } else {
          activeJobId = null;
          setOpsEnabled(true);
          if (job.status === "succeeded") {
            frame.src = frame.src;
          }
        }
      } catch (error) {
        opsStatus.textContent = `Job polling failed: ${error.message}`;
        setOpsEnabled(true);
      }
    }

    async function startJob(kind) {
      const endpoints = {
        "scrape-vahan": "/api/scrape/vahan/recent",
        "rebuild-vahan": "/api/rebuild/vahan",
        "scrape-solar": "/api/scrape/solar",
        "rebuild-solar": "/api/rebuild/solar"
      };
      const endpoint = endpoints[kind];
      if (!endpoint) return;
      setOpsEnabled(false);
      jobLog.textContent = "";
      jobLog.classList.remove("is-visible");
      try {
        const job = await apiRequest(endpoint, {
          method: "POST",
          body: JSON.stringify({})
        });
        opsStatus.textContent = `Queued ${job.kind} (${job.id})`;
        pollJob(job.id);
      } catch (error) {
        opsStatus.textContent = `Could not start job: ${error.message}`;
        setOpsEnabled(true);
      }
    }

    for (const button of jobButtons) {
      button.addEventListener("click", () => {
        if (activeJobId) return;
        startJob(button.dataset.job);
      });
    }

    setOpsEnabled(false);
    checkHealth();
  </script>
</body>
</html>
